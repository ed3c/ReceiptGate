name: acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pinned dependencies for transcript verification
        run: bun install --frozen-lockfile
      - name: Run exact acceptance path
        run: bun run acceptance
      - name: Assert receipt binds exact candidate
        run: |
          cat artifacts/runtime-receipt.json
          bun -e 'const r = await Bun.file("artifacts/runtime-receipt.json").json(); if (r.commit !== process.env.TARGET_SHA) throw new Error(`receipt ${r.commit} != target ${process.env.TARGET_SHA}`)'
      - name: Retain cloud runtime receipt
        uses: actions/upload-artifact@v4
        with:
          name: receiptgate-runtime-${{ env.TARGET_SHA }}
          path: artifacts/runtime-receipt.json
          if-no-files-found: error
          retention-days: 7
