name: galileo-balance

on:
  workflow_dispatch:
    inputs:
      address:
        description: 'Public 0G Galileo EVM address to inspect'
        required: true
        type: string

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate public address shape
        shell: bash
        env:
          ADDRESS: ${{ inputs.address }}
        run: |
          [[ "$ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]
      - name: Read public Galileo balance
        env:
          ZG_WALLET_ADDRESS: ${{ inputs.address }}
        run: bun scripts/check-galileo-balance.mjs | tee galileo-balance.json
      - uses: actions/upload-artifact@v4
        with:
          name: galileo-balance
          path: galileo-balance.json
          retention-days: 1
