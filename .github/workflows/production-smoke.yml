name: production-smoke

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'demo/**'
      - 'public/**'
      - 'vercel.json'
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://receiptgate.vercel.app
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pinned dependencies for wallet smoke signer
        run: bun install --frozen-lockfile
      - name: Wait for exact Vercel production commit on both health routes
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ready=0
          for _ in $(seq 1 72); do
            api_code=$(curl -sS -o artifacts/api-health.json -w '%{http_code}' "$BASE_URL/api/healthz" || true)
            rewrite_code=$(curl -sS -o artifacts/health-rewrite.json -w '%{http_code}' "$BASE_URL/healthz" || true)
            if [[ "$api_code" == "200" && "$rewrite_code" == "200" ]]; then
              if bun -e '
                const a=await Bun.file("artifacts/api-health.json").json();
                const b=await Bun.file("artifacts/health-rewrite.json").json();
                process.exit(a.ok===true&&b.ok===true&&a.gitCommit===process.env.TARGET_SHA&&b.gitCommit===process.env.TARGET_SHA?0:1);' >/dev/null 2>&1; then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          echo 'api health:'; cat artifacts/api-health.json || true
          echo; echo 'health rewrite:'; cat artifacts/health-rewrite.json || true
          test "$ready" = 1
      - name: Public HTTPS smoke
        run: |
          set -euo pipefail
          root_code=$(curl -sS -o artifacts/root.html -w '%{http_code}' "$BASE_URL/")
          capability_page_code=$(curl -sS -o artifacts/capability.html -w '%{http_code}' "$BASE_URL/capability.html")
          api_health_code=200
          health_code=200
          config_code=$(curl -sS -o artifacts/config.json -w '%{http_code}' "$BASE_URL/api/config")
          normal_code=$(curl -sS -o artifacts/demo-normal.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"tamper":false}' "$BASE_URL/api/demo")
          tamper_code=$(curl -sS -o artifacts/demo-tamper.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"tamper":true}' "$BASE_URL/api/demo")
          anon_code=$(curl -sS -o artifacts/live-compute-anonymous.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$BASE_URL/api/live/compute")
          anon_multi_code=$(curl -sS -o artifacts/live-multi-agent-anonymous.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$BASE_URL/api/live/multi-agent")
          anon_capability_code=$(curl -sS -o artifacts/live-capability-anonymous.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$BASE_URL/api/live/capability")
          bun -e '
            import { generatePrivateKey, privateKeyToAccount } from "viem/accounts";
            const config=await Bun.file("artifacts/config.json").json();
            const account=privateKeyToAccount(generatePrivateKey());
            async function auth(save=false){
              const challengeResponse=await fetch(`${process.env.BASE_URL}/api/wallet/challenge?address=${account.address}`);
              const challenge=await challengeResponse.json();
              if(challengeResponse.status!==200)throw new Error(`wallet challenge ${challengeResponse.status}`);
              const signature=await account.signMessage({message:challenge.message});
              const verifyResponse=await fetch(`${process.env.BASE_URL}/api/wallet/verify`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({address:account.address,message:challenge.message,signature})});
              const verification=await verifyResponse.json();
              if(verifyResponse.status!==200)throw new Error(`wallet verify ${verifyResponse.status}: ${JSON.stringify(verification)}`);
              if(save){
                await Bun.write("artifacts/wallet-challenge.json",JSON.stringify(challenge));
                await Bun.write("artifacts/wallet-verify.json",JSON.stringify(verification));
              }
              return {address:account.address,message:challenge.message,signature};
            }
            await auth(true);
            if(config.computeConfigured===true){
              if(config.serveProofConfigured!==true){
                const authorization=await auth();
                const response=await fetch(`${process.env.BASE_URL}/api/live/multi-agent`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...authorization,tamper:false})});
                const body=await response.text();
                await Bun.write("artifacts/live-runtime-blocked.json",JSON.stringify({status:response.status,body},null,2));
                const blocked=JSON.parse(body);
                if(response.status!==503||blocked.blockedAt!=="serveproof-configuration"||blocked.sideEffectCalls!==0||blocked.computeCalls!==0)throw new Error("Missing ServeProof did not fail closed before Compute");
                throw new Error("Full LIVE acceptance blocked: sealed candidate-bound ServeProof is not configured; zero Compute and side-effect calls verified");
              }
              const normalAuth=await auth();
              const normalResponse=await fetch(`${process.env.BASE_URL}/api/live/multi-agent`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...normalAuth,tamper:false})});
              const normal=await normalResponse.json();
              await Bun.write("artifacts/live-multi-agent-normal.json",JSON.stringify(normal,null,2));
              if(normalResponse.status!==200||normal.live!==true||normal.agentA?.live!==true||normal.agentB?.live!==true||normal.handoff?.bound!==true||normal.policy?.allowed!==true||normal.execution?.status!=="executed"||normal.sideEffectCalls!==1)throw new Error(`live multi-agent normal failed ${normalResponse.status}: ${JSON.stringify(normal)}`);
              const tamperAuth=await auth();
              const tamperResponse=await fetch(`${process.env.BASE_URL}/api/live/multi-agent`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...tamperAuth,tamper:true})});
              const tamper=await tamperResponse.json();
              await Bun.write("artifacts/live-multi-agent-tamper.json",JSON.stringify(tamper,null,2));
              if(tamperResponse.status!==200||tamper.live!==true||tamper.agentA?.live!==true||tamper.agentB?.live!==true||tamper.handoff?.bound!==false||tamper.policy?.allowed!==false||tamper.execution?.status!=="blocked"||tamper.sideEffectCalls!==0)throw new Error(`live multi-agent tamper failed ${tamperResponse.status}: ${JSON.stringify(tamper)}`);
              await Bun.write("artifacts/live-multi-agent-summary.json",JSON.stringify({configured:true,verified:true,normal:{handoffBound:normal.handoff.bound,policyAllowed:normal.policy.allowed,sideEffectCalls:normal.sideEffectCalls,agentA:normal.agentA.role,agentB:normal.agentB.role,model:normal.model},tamper:{handoffBound:tamper.handoff.bound,policyAllowed:tamper.policy.allowed,sideEffectCalls:tamper.sideEffectCalls}},null,2));

              const capabilityAuth=await auth();
              const capabilityResponse=await fetch(`${process.env.BASE_URL}/api/live/capability`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(capabilityAuth)});
              const capability=await capabilityResponse.json();
              await Bun.write("artifacts/live-capability.json",JSON.stringify(capability,null,2));
              const validStatus=new Set(["degraded","improved","preserved-within-tolerance"]);
              const validHash=(v)=>typeof v==="string"&&/^0x[0-9a-f]{64}$/i.test(v);
              if(capabilityResponse.status!==200||capability.schema!=="receiptgate-capability-receipt-v1"||capability.live!==true||capability.sameModel!==true||capability.reference?.live!==true||capability.candidate?.live!==true||!validHash(capability.receiptHash)||!validHash(capability.evalSuiteHash)||!validHash(capability.reference?.harnessHash)||!validHash(capability.candidate?.harnessHash)||!validStatus.has(capability.continuity?.status))throw new Error(`live capability receipt failed ${capabilityResponse.status}: ${JSON.stringify(capability)}`);
              const rs=capability.reference.evaluation?.score,cs=capability.candidate.evaluation?.score;
              if(!Number.isFinite(rs)||!Number.isFinite(cs)||rs<0||rs>100||cs<0||cs>100)throw new Error("capability scores out of range");
              await Bun.write("artifacts/live-capability-summary.json",JSON.stringify({configured:true,verified:true,model:capability.model,transport:capability.transport,referenceScore:rs,candidateScore:cs,continuity:capability.continuity,receiptHash:capability.receiptHash,evalSuiteHash:capability.evalSuiteHash},null,2));
            }else{
              const reason="Vercel ZG_SERVICE_URL / ZG_MODEL / ZG_API_SECRET not configured";
              await Bun.write("artifacts/live-multi-agent-summary.json",JSON.stringify({configured:false,verified:false,skipped:true,reason},null,2));
              await Bun.write("artifacts/live-capability-summary.json",JSON.stringify({configured:false,verified:false,skipped:true,reason},null,2));
            }'
          printf 'root=%s capability_page=%s api_health=%s health=%s config=%s normal=%s tamper=%s anonymous_compute=%s anonymous_multi_agent=%s anonymous_capability=%s wallet=verified\n' "$root_code" "$capability_page_code" "$api_health_code" "$health_code" "$config_code" "$normal_code" "$tamper_code" "$anon_code" "$anon_multi_code" "$anon_capability_code"
          test "$root_code" = 200
          test "$capability_page_code" = 200
          test "$api_health_code" = 200
          test "$health_code" = 200
          test "$config_code" = 200
          test "$normal_code" = 200
          test "$tamper_code" = 200
          test "$anon_code" = 401
          test "$anon_multi_code" = 401
          test "$anon_capability_code" = 401
          grep -q 'SAME MODEL' artifacts/capability.html
          grep -q 'ReceiptGateCapabilityProof' artifacts/capability.html
          bun -e '
            const a=await Bun.file("artifacts/api-health.json").json();
            const b=await Bun.file("artifacts/health-rewrite.json").json();
            const c=await Bun.file("artifacts/config.json").json();
            const n=await Bun.file("artifacts/demo-normal.json").json();
            const t=await Bun.file("artifacts/demo-tamper.json").json();
            const x=await Bun.file("artifacts/live-compute-anonymous.json").json();
            const xm=await Bun.file("artifacts/live-multi-agent-anonymous.json").json();
            const xc=await Bun.file("artifacts/live-capability-anonymous.json").json();
            const wc=await Bun.file("artifacts/wallet-challenge.json").json();
            const wv=await Bun.file("artifacts/wallet-verify.json").json();
            const ma=await Bun.file("artifacts/live-multi-agent-summary.json").json();
            const cap=await Bun.file("artifacts/live-capability-summary.json").json();
            if(a.gitCommit!==process.env.TARGET_SHA||b.gitCommit!==process.env.TARGET_SHA)throw new Error("production commit mismatch");
            if(c.walletAuthorizationRequiredForCompute!==true)throw new Error("wallet auth config missing");
            if(n.receipt?.execution?.status!=="executed"||n.sideEffectCalls!==1)throw new Error("normal production demo failed");
            if(t.receipt?.execution?.status!=="blocked"||t.sideEffectCalls!==0||t.receipt?.verification?.checks?.candidateBinding!==false)throw new Error("tamper production demo failed");
            if(x.authorized!==false||xm.authorized!==false||xc.authorized!==false)throw new Error("anonymous sponsored path was not rejected");
            if(wc.chainId!==16602||wc.origin!==process.env.BASE_URL)throw new Error("production wallet challenge mismatch");
            if(wv.ok!==true||wv.checks?.signature!==true||wv.checks?.origin!==true||wv.checks?.chain!==true||wv.checks?.candidateHash!==true)throw new Error("production wallet verification failed");
            if(c.computeConfigured===true&&(ma.verified!==true||cap.verified!==true))throw new Error("configured production did not verify all live Compute proof surfaces");
            const summary={schema:"receiptgate-production-smoke-v4",accepted:true,commit:process.env.TARGET_SHA,url:process.env.BASE_URL,health:a,normal:{status:n.receipt.execution.status,sideEffectCalls:n.sideEffectCalls},tamper:{status:t.receipt.execution.status,sideEffectCalls:t.sideEffectCalls,candidateBinding:t.receipt.verification.checks.candidateBinding},anonymousCompute:{status:401,authorized:x.authorized},anonymousMultiAgent:{status:401,authorized:xm.authorized},anonymousCapability:{status:401,authorized:xc.authorized},wallet:{challenge:true,verified:wv.ok,address:wv.address,chainId:wv.chainId,checks:wv.checks},multiAgent:ma,capability:cap,generatedAt:new Date().toISOString()};
            await Bun.write("artifacts/production-smoke.json",JSON.stringify(summary,null,2)+"\n");
            console.log(JSON.stringify(summary));'
      - name: Retain production readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiptgate-production-${{ env.TARGET_SHA }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
