name: vercel-shape

on:
  pull_request:
    paths:
      - 'vercel.json'
      - 'api/**'
      - 'public/**'
      - 'demo/wallet.ts'
      - 'demo/vercel.ts'
      - 'tests/wallet-authorization.test.ts'
      - 'package.json'
      - '.github/workflows/vercel-shape.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vercel.json'
      - 'api/**'
      - 'public/**'
      - 'demo/wallet.ts'
      - 'demo/vercel.ts'
      - 'tests/wallet-authorization.test.ts'
      - 'package.json'
      - '.github/workflows/vercel-shape.yml'

permissions:
  contents: read

jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run wallet authorization planted controls
        run: bun run test:wallet
      - name: Bootstrap every Vercel Bun function
        run: |
          if grep -R --include='*.ts' -n 'Bun\.serve' api; then
            echo 'api/** must use export default { fetch }, not Bun.serve' >&2
            exit 1
          fi
          bun -e 'for (const p of ["./api/config.ts","./api/healthz.ts","./api/demo.ts","./api/live/compute.ts","./api/live/agent.ts","./api/wallet/challenge.ts","./api/wallet/verify.ts"]) { const m=await import(p); if (typeof m.default?.fetch !== "function") throw new Error(`${p} missing default.fetch`); } const hz=await (await import("./api/healthz.ts")).default.fetch(new Request("https://receiptgate.example/api/healthz")); if (hz.status!==200) throw new Error(`healthz ${hz.status}`); console.log("vercel export-default bootstraps: ok"); process.exit(0)'
      - name: Exercise actual public route handlers without secrets
        run: |
          bun -e '
            const config=(await import("./api/config.ts")).default;
            const demo=(await import("./api/demo.ts")).default;
            const compute=(await import("./api/live/compute.ts")).default;
            const challenge=(await import("./api/wallet/challenge.ts")).default;
            const agent=(await import("./api/live/agent.ts")).default;
            const cr=await config.fetch(new Request("https://receiptgate.example/api/config"));
            if(cr.status!==200) throw new Error(`config ${cr.status}`);
            const cj=await cr.json();
            if(cj.walletAuthorizationRequiredForCompute!==true) throw new Error("wallet auth config missing");
            const normal=await demo.fetch(new Request("https://receiptgate.example/api/demo",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({tamper:false})}));
            const nj=await normal.json();
            if(normal.status!==200||nj.receipt?.execution?.status!=="executed"||nj.sideEffectCalls!==1) throw new Error("normal route failed");
            const tamper=await demo.fetch(new Request("https://receiptgate.example/api/demo",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({tamper:true})}));
            const tj=await tamper.json();
            if(tamper.status!==200||tj.receipt?.execution?.status!=="blocked"||tj.sideEffectCalls!==0||tj.receipt?.verification?.checks?.candidateBinding!==false) throw new Error("tamper route failed");
            const anon=await compute.fetch(new Request("https://receiptgate.example/api/live/compute",{method:"POST",headers:{"content-type":"application/json"},body:"{}"}));
            if(anon.status!==401) throw new Error(`anonymous live Compute status ${anon.status}`);
            const wc=await challenge.fetch(new Request("https://receiptgate.example/api/wallet/challenge?address=0x0000000000000000000000000000000000000001"));
            if(wc.status!==200) throw new Error(`wallet challenge ${wc.status}`);
            const wj=await wc.json();
            if(wj.chainId!==16602||wj.origin!=="https://receiptgate.example") throw new Error("wallet challenge binding mismatch");
            const ar=await agent.fetch(new Request("https://receiptgate.example/api/live/agent"));
            if(ar.status!==200) throw new Error(`unconfigured agent route ${ar.status}`);
            const aj=await ar.json();
            if(aj.configured!==false||aj.live!==false) throw new Error("unconfigured agent route mismatch");
            console.log(JSON.stringify({config:cr.status,normal:normal.status,tamper:tamper.status,anonymousCompute:anon.status,walletChallenge:wc.status,agentUnconfigured:ar.status}));'
      - name: Validate Vercel Bun shape, health rewrite, and secret boundary
        run: |
          bun -e 'const c=await Bun.file("vercel.json").json();const h=(c.rewrites??[]).some((r)=>r.source==="/healthz"&&r.destination==="/api/healthz");if(c.bunVersion!=="1.x"||c.outputDirectory!=="public"||!h)throw new Error("vercel Bun configuration mismatch")'
          test -f public/index.html
          ! grep -R "process.env.PRIVATE_KEY" api demo/vercel.ts demo/wallet.ts
