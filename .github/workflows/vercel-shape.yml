name: vercel-shape

on:
  pull_request:
    paths:
      - 'vercel.json'
      - 'api/**'
      - 'public/**'
      - 'demo/wallet.ts'
      - 'demo/vercel.ts'
      - 'tests/wallet-authorization.test.ts'
      - 'package.json'
      - '.github/workflows/vercel-shape.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vercel.json'
      - 'api/**'
      - 'public/**'
      - 'demo/wallet.ts'
      - 'demo/vercel.ts'
      - 'tests/wallet-authorization.test.ts'
      - 'package.json'
      - '.github/workflows/vercel-shape.yml'

permissions:
  contents: read

jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run wallet authorization planted controls
        run: bun run test:wallet
      - name: Bootstrap every Vercel Bun function
        run: |
          if grep -R --include='*.ts' -n 'Bun\.serve' api; then
            echo 'api/** must use export default { fetch }, not Bun.serve' >&2
            exit 1
          fi
          bun -e 'for (const p of ["./api/config.ts","./api/healthz.ts","./api/demo.ts","./api/live/compute.ts","./api/live/agent.ts","./api/wallet/challenge.ts","./api/wallet/verify.ts"]) { const m=await import(p); if (typeof m.default?.fetch !== "function") throw new Error(`${p} missing default.fetch`); } const hz=await (await import("./api/healthz.ts")).default.fetch(new Request("https://receiptgate.example/api/healthz")); if (hz.status!==200) throw new Error(`healthz ${hz.status}`); console.log("vercel export-default bootstraps: ok"); process.exit(0)'
      - name: Assert anonymous sponsored Compute is rejected before provider execution
        run: |
          bun -e 'const {liveComputeHandler}=await import("./demo/vercel.ts");const r=await liveComputeHandler(new Request("https://receiptgate.example/api/live/compute",{method:"POST",headers:{"content-type":"application/json"},body:"{}"}));if(r.status!==401)throw new Error(`anonymous live Compute status ${r.status}`);console.log(await r.text())'
      - name: Validate Vercel Bun shape, health rewrite, and secret boundary
        run: |
          bun -e 'const c=await Bun.file("vercel.json").json();const h=(c.rewrites??[]).some((r)=>r.source==="/healthz"&&r.destination==="/api/healthz");if(c.bunVersion!=="1.x"||c.outputDirectory!=="public"||!h)throw new Error("vercel Bun configuration mismatch")'
          test -f public/index.html
          ! grep -R "process.env.PRIVATE_KEY" api demo/vercel.ts demo/wallet.ts
