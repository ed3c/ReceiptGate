name: vercel-shape

on:
  pull_request:
    paths:
      - 'vercel.json'
      - 'api/**'
      - 'public/**'
      - 'demo/wallet.ts'
      - 'demo/vercel.ts'
      - 'tests/wallet-authorization.test.ts'
      - 'tests/vercel-demo-parity.test.ts'
      - 'tests/capability-receipt.test.ts'
      - 'package.json'
      - '.github/workflows/vercel-shape.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vercel.json'
      - 'api/**'
      - 'public/**'
      - 'demo/wallet.ts'
      - 'demo/vercel.ts'
      - 'tests/wallet-authorization.test.ts'
      - 'tests/vercel-demo-parity.test.ts'
      - 'tests/capability-receipt.test.ts'
      - 'package.json'
      - '.github/workflows/vercel-shape.yml'

permissions:
  contents: read

jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run wallet authorization planted controls
        run: bun run test:wallet
      - name: Run capability receipt planted controls
        run: bun run test:capability
      - name: Prove Vercel demo adapter parity with core gate
        run: bun test tests/vercel-demo-parity.test.ts
      - name: Bootstrap every Vercel function
        run: |
          if grep -R --include='*.ts' -n 'Bun\.serve' api; then
            echo 'api/** must use export default { fetch }, not Bun.serve' >&2
            exit 1
          fi
          bun -e 'for (const p of ["./api/config.ts","./api/healthz.ts","./api/demo.ts","./api/live/compute.ts","./api/live/multi-agent.ts","./api/live/capability.ts","./api/live/agent.ts","./api/wallet/challenge.ts","./api/wallet/verify.ts"]) { const m=await import(p); if (typeof m.default?.fetch !== "function") throw new Error(`${p} missing default.fetch`); } const hz=await (await import("./api/healthz.ts")).default.fetch(new Request("https://receiptgate.example/api/healthz")); if (hz.status!==200) throw new Error(`healthz ${hz.status}`); console.log("vercel export-default bootstraps: ok"); process.exit(0)'
      - name: Exercise public routes without secrets
        run: |
          bun -e '
            const config=(await import("./api/config.ts")).default;
            const demo=(await import("./api/demo.ts")).default;
            const compute=(await import("./api/live/compute.ts")).default;
            const multi=(await import("./api/live/multi-agent.ts")).default;
            const capability=(await import("./api/live/capability.ts")).default;
            const challenge=(await import("./api/wallet/challenge.ts")).default;
            const agent=(await import("./api/live/agent.ts")).default;
            const cr=await config.fetch(new Request("https://receiptgate.example/api/config"));
            if(cr.status!==200) throw new Error(`config ${cr.status}`);
            const cj=await cr.json();
            if(cj.walletAuthorizationRequiredForCompute!==true) throw new Error("wallet auth config missing");
            const normal=await demo.fetch(new Request("https://receiptgate.example/api/demo",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({tamper:false})}));
            const nj=await normal.json();
            if(normal.status!==200||nj.receipt?.execution?.status!=="executed"||nj.sideEffectCalls!==1) throw new Error("normal route failed");
            const tamper=await demo.fetch(new Request("https://receiptgate.example/api/demo",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({tamper:true})}));
            const tj=await tamper.json();
            if(tamper.status!==200||tj.receipt?.execution?.status!=="blocked"||tj.sideEffectCalls!==0||tj.receipt?.verification?.checks?.candidateBinding!==false) throw new Error("tamper route failed");
            const anon=await compute.fetch(new Request("https://receiptgate.example/api/live/compute",{method:"POST",headers:{"content-type":"application/json"},body:"{}"}));
            if(anon.status!==401) throw new Error(`anonymous live Compute status ${anon.status}`);
            const anonMulti=await multi.fetch(new Request("https://receiptgate.example/api/live/multi-agent",{method:"POST",headers:{"content-type":"application/json"},body:"{}"}));
            if(anonMulti.status!==401) throw new Error(`anonymous multi-agent status ${anonMulti.status}`);
            const anonCapability=await capability.fetch(new Request("https://receiptgate.example/api/live/capability",{method:"POST",headers:{"content-type":"application/json"},body:"{}"}));
            if(anonCapability.status!==401) throw new Error(`anonymous capability status ${anonCapability.status}`);
            const wc=await challenge.fetch(new Request("https://receiptgate.example/api/wallet/challenge?address=0x0000000000000000000000000000000000000001"));
            if(wc.status!==200) throw new Error(`wallet challenge ${wc.status}`);
            const wj=await wc.json();
            if(wj.chainId!==16602||wj.origin!=="https://receiptgate.example") throw new Error("wallet challenge binding mismatch");
            const ar=await agent.fetch(new Request("https://receiptgate.example/api/live/agent"));
            if(ar.status!==200) throw new Error(`unconfigured agent route ${ar.status}`);
            const aj=await ar.json();
            if(aj.configured!==false||aj.live!==false) throw new Error("unconfigured agent route mismatch");
            console.log(JSON.stringify({config:cr.status,normal:normal.status,tamper:tamper.status,anonymousCompute:anon.status,anonymousMultiAgent:anonMulti.status,anonymousCapability:anonCapability.status,walletChallenge:wc.status,agentUnconfigured:ar.status}));'
      - name: Prove multi-agent handoff positive and planted tamper
        run: |
          bun -e '
            const m=await import("./api/live/multi-agent.ts");
            const candidate={id:"test",kind:"purchase",target:"0G GPU inference credits",amount:247,currency:"USD",payload:{product:"GPU inference credits",units:10000,quotedPrice:247,sourceRisk:"low",sourceReason:"quote within budget",computeModel:"test-model"}};
            const originalHash=await m.candidateHash(candidate);
            const goodReview={candidateHash:originalHash,verdict:"ALLOW",risk:"low",reason:"within deterministic limits"};
            const good=m.evaluateHandoff({originalHash,transmittedHash:originalHash,review:goodReview,candidate});
            if(good.handoff.bound!==true||good.policy.allowed!==true||good.execution.status!=="executed"||good.execution.sideEffectCalls!==1)throw new Error(`good handoff failed ${JSON.stringify(good)}`);
            const changed={...candidate,amount:2470,payload:{...candidate.payload}};
            const changedHash=await m.candidateHash(changed);
            const badReview={candidateHash:changedHash,verdict:"DENY",risk:"high",reason:"over budget"};
            const bad=m.evaluateHandoff({originalHash,transmittedHash:changedHash,review:badReview,candidate:changed});
            if(bad.handoff.bound!==false||bad.policy.allowed!==false||bad.execution.status!=="blocked"||bad.execution.sideEffectCalls!==0)throw new Error(`tamper handoff failed ${JSON.stringify(bad)}`);
            console.log(JSON.stringify({normal:{bound:good.handoff.bound,allowed:good.policy.allowed,sideEffectCalls:good.execution.sideEffectCalls},tamper:{bound:bad.handoff.bound,allowed:bad.policy.allowed,sideEffectCalls:bad.execution.sideEffectCalls}}));'
      - name: Prove Galileo RPC EIP-191 recovery positive and negative
        run: |
          bun -e '
            import {generatePrivateKey,privateKeyToAccount} from "viem/accounts";
            const challengeRoute=(await import("./api/wallet/challenge.ts")).default;
            const verifyRoute=(await import("./api/wallet/verify.ts")).default;
            const account=privateKeyToAccount(generatePrivateKey());
            const other=privateKeyToAccount(generatePrivateKey());
            const challengeResponse=await challengeRoute.fetch(new Request(`https://receiptgate.example/api/wallet/challenge?address=${account.address}`));
            const challenge=await challengeResponse.json();
            if(challengeResponse.status!==200)throw new Error(`challenge ${challengeResponse.status}`);
            const signature=await account.signMessage({message:challenge.message});
            const positive=await verifyRoute.fetch(new Request("https://receiptgate.example/api/wallet/verify",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({address:account.address,message:challenge.message,signature})}));
            const p=await positive.json();
            if(positive.status!==200||p.ok!==true||p.checks?.signature!==true||p.checks?.rpcChain!==true||p.verificationTransport!=="0g-galileo-rpc-ecrecover")throw new Error(`Galileo positive failed: ${JSON.stringify(p)}`);
            const wrongSignature=await other.signMessage({message:challenge.message});
            const negative=await verifyRoute.fetch(new Request("https://receiptgate.example/api/wallet/verify",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({address:account.address,message:challenge.message,signature:wrongSignature})}));
            const n=await negative.json();
            if(negative.status!==401||n.ok!==false||n.checks?.signature!==false||n.checks?.rpcChain!==true)throw new Error(`Galileo planted negative failed: ${JSON.stringify(n)}`);
            console.log(JSON.stringify({transport:p.verificationTransport,chainId:p.chainId,positive:p.ok,negative:n.ok}));'
      - name: Validate Vercel Bun shape, health rewrite, and secret boundary
        run: |
          bun -e 'const c=await Bun.file("vercel.json").json();const h=(c.rewrites??[]).some((r)=>r.source==="/healthz"&&r.destination==="/api/healthz");if(c.bunVersion!=="1.x"||c.outputDirectory!=="public"||!h)throw new Error("vercel Bun configuration mismatch")'
          test -f public/index.html
          test -f public/capability.html
          ! grep -R "process.env.PRIVATE_KEY" api demo/vercel.ts demo/wallet.ts
